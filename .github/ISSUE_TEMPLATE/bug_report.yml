name: Bug report
description: Report a reproducible driver problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the driver. Never paste a local key, device ID, IP address or an unedited `devices.json`.
  - type: input
    id: model
    attributes:
      label: Ventilator model
      description: For example Base WiFi 160 (humidity) or Venti WiFi 160 (CO₂).
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Tuya protocol version
      description: From the log line "connected with Tuya protocol 3.x", or `version` in devices.json.
      placeholder: "3.4"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: DP mapping (optional)
      description: The `mapping` section from devices.json, codes and types only.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Sanitized SmartThings Edge logs
      description: Remove device IDs, keys and local addresses before posting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed local keys, device IDs and network addresses from the report.
          required: true
