name: arida-ventilator-humidity.v1
components:
  - id: main
    label: Ventilator
    capabilities:
      - id: switch
        version: 1
      - id: fanSpeed
        version: 1
      - id: appledouble53939.ventilationMode
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: filterStatus
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Fan
  - id: sensorControl
    label: Fuktstyring
    capabilities:
      - id: switch
        version: 1
    categories:
      - name: Switch
  - id: boost
    label: Boost
    capabilities:
      - id: switch
        version: 1
    categories:
      - name: Switch
preferences:
  - name: ipAddress
    title: IP-adresse (valgfritt)
    description: La stå på auto, så finner driveren ventilatoren selv, også når ruteren gir den ny adresse. Skriv en IP bare for å låse den.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 4
      maxLength: 15
      default: "auto"
  - name: deviceId
    title: Device ID
    description: Tuya device ID (fra tinytuya wizard eller Tuya IoT Platform).
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 10
      maxLength: 40
      default: "enter-device-id"
  - name: localKey
    title: Local key
    description: Tuya local key, nøyaktig 16 tegn. Lim inn i stedet for å skrive.
    required: true
    preferenceType: string
    definition:
      stringType: password
      minLength: 16
      maxLength: 16
      default: "enter-local-key!"
  - name: protocolVersion
    title: Tuya-protokoll
    description: La stå på Automatisk med mindre tilkoblingen feiler.
    required: true
    preferenceType: enumeration
    definition:
      options:
        auto: Automatisk
        v33: "3.3"
        v34: "3.4"
        v35: "3.5"
      default: auto
  - name: pollInterval
    title: Oppdateringsintervall (sekunder)
    description: Hvor ofte status hentes fra ventilatoren.
    required: true
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 3600
      default: 30
  - name: sensorThreshold
    title: Terskel for fuktstyring (%RF)
    description: Luftfuktighet (50–95 %) der ventilatoren øker avtrekket. 0 = ikke endre innstillingen i ventilatoren.
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 95
      default: 0
  - name: dpMap
    title: DP-oppsett (avansert)
    description: Overstyr DP-numre, f.eks. "sensor=105,threshold=104". standard = innebygde verdier.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "standard"
